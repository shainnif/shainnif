<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Shaine Ismail — Data, Architecture, AI, Engineering</title>
  <desc id="hero-desc">Shaine Ismail builds data platforms, AI systems and useful software. A simple data-flow schematic runs from data to model to platform to product.</desc>

  <!-- sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif -->
  <!-- mono:  ui-monospace, SFMono-Regular, Menlo, Consolas, monospace -->

  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#141A21" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" rx="18" fill="#0B0E12"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="17.5" fill="none" stroke="#1C2128" stroke-width="1"/>

  <!-- ===== left: identity ===== -->
  <g transform="translate(64 72)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5A6572">// data · architecture · ai · engineering</text>

    <text x="-2" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#E6EDF3">SHAINE ISMAIL</text>

    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#C9D1D9">I build data platforms, AI systems</text>
    <text x="0" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#C9D1D9">and useful software.</text>

    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8B949E">20+ years across engineering, architecture and</text>
    <text x="0" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8B949E">technology leadership — still working close to the code.</text>

    <g transform="translate(0 252)">
      <circle cx="4" cy="-5" r="3" fill="#E8B94B"/>
      <text x="18" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5A6572">UK · CO-FOUNDER, BIGSPARK</text>
    </g>
  </g>

  <!-- ===== right: data-flow schematic ===== -->
  <g transform="translate(796 50)">
    <line x1="20" y1="26" x2="20" y2="284" stroke="#232A33" stroke-width="1.5"/>

    <g transform="translate(0 0)">
      <circle cx="20" cy="26" r="4" fill="#E8B94B"/>
      <rect x="48" y="0" width="180" height="52" rx="8" fill="#11151B" stroke="#232A33" stroke-width="1"/>
      <text x="66" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5A6572">01</text>
      <text x="66" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">DATA</text>
    </g>

    <g transform="translate(0 86)">
      <circle cx="20" cy="26" r="4" fill="#5A6572"/>
      <rect x="48" y="0" width="180" height="52" rx="8" fill="#11151B" stroke="#232A33" stroke-width="1"/>
      <text x="66" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5A6572">02</text>
      <text x="66" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">MODEL</text>
    </g>

    <g transform="translate(0 172)">
      <circle cx="20" cy="26" r="4" fill="#5A6572"/>
      <rect x="48" y="0" width="180" height="52" rx="8" fill="#11151B" stroke="#232A33" stroke-width="1"/>
      <text x="66" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5A6572">03</text>
      <text x="66" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">PLATFORM</text>
    </g>

    <g transform="translate(0 258)">
      <circle cx="20" cy="26" r="4" fill="#5A6572"/>
      <rect x="48" y="0" width="180" height="52" rx="8" fill="#11151B" stroke="#232A33" stroke-width="1"/>
      <text x="66" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5A6572">04</text>
      <text x="66" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6EDF3">PRODUCT</text>
    </g>
  </g>
</svg>
